<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Skill Bridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <div class="logo">
            Skill Bridge
        </div>

        <nav>
            <a href="/">Home</a>
        </nav>

    </header>


    <main>

        <section class="register-section">

            <div class="register-box">

                <h1>Welcome Back</h1>

                <p>
                    Login to continue to Skill Bridge.
                </p>


                <form method="POST">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button type="submit" class="primary-btn">
                        Login
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
